[build]
builder = "NIXPACKS"
buildCommand = "npm run build && cp -r .next/static .next/standalone/.next/static"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 npx prisma db push --skip-generate && HOSTNAME=0.0.0.0 npx tsx prisma/seed.ts && HOSTNAME=0.0.0.0 node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
